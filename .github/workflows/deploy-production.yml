name: deploy-production

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require production configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          required=(VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY PUSH_CRON_SECRET SUPABASE_SERVICE_ROLE_KEY PRODUCTION_URL)
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing production value: $name"; exit 1; }
          done
      - name: Load Vercel automation bypass
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          bypass="$(jq --raw-output '.protectionBypass | to_entries[] | select(.value.scope == "automation-bypass") | .key' <<< "$response" | head -n 1)"
          test -n "$bypass" || { echo "Vercel automation bypass is not configured"; exit 1; }
          echo "::add-mask::$bypass"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass" >> "$GITHUB_ENV"
      # Las migraciones se aplican ANTES de validar el staged. Es seguro porque son forward-only y compatibles
      # con la version anterior (expand/contract, AGENTS.md): si el staged se descarta, produccion sigue sirviendo
      # la version anterior sobre el esquema nuevo.
      - name: Apply forward-only database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID"
          npx --no-install supabase db push --linked --dry-run
          npx --no-install supabase db push --linked
      - name: Validate production database and environment
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run env:validate && npm run migrate:validate
      - name: Create staged production deployment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          url="$(npx --ignore-scripts --yes vercel@59.23.2 --prod --skip-domain --force --yes --token "$VERCEL_TOKEN")"
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+$ ]] || { echo "Vercel did not return a deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Resolve staged deployment id
        id: staged
        env:
          STAGED_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: echo "deployment_id=$(node scripts/vercel-production-alias.mjs id "$STAGED_DEPLOYMENT_URL")" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Validate staged deployment
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:browser
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ steps.deploy.outputs.url }}/login
          configPath: ./lighthouserc.deployment.cjs
          uploadArtifacts: true
      - name: Capture current production deployment
        id: current-production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: echo "deployment_id=$(node scripts/vercel-production-alias.mjs current)" >> "$GITHUB_OUTPUT"
      - name: Promote exact staged deployment
        id: promote
        env:
          STAGED_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/vercel-production-alias.mjs promote "$STAGED_DEPLOYMENT_URL"
      - name: Verify production
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: npm run test:e2e
      # Recuperacion basada en el destino REAL de produccion: cubre una promocion fallida o parcial (POST aceptado
      # pero sondeo agotado) y una verificacion posterior fallida. No hace nada si produccion ya sirve la version anterior.
      - name: Recover production after a failed promotion or verification
        if: failure() && steps.current-production.outputs.deployment_id != ''
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.current-production.outputs.deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/vercel-production-alias.mjs recover "$PREVIOUS_DEPLOYMENT_ID"
      # Limpieza del despliegue en cola que creamos si el release fallo. Nunca borra el que sirve produccion.
      - name: Remove the staged deployment that did not go live
        if: failure() && steps.staged.outputs.deployment_id != ''
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged.outputs.deployment_id }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.current-production.outputs.deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/vercel-production-alias.mjs remove "$STAGED_DEPLOYMENT_ID" "$PREVIOUS_DEPLOYMENT_ID"
