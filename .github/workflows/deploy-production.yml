name: deploy-production

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require production configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          required=(VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY PUSH_CRON_SECRET SUPABASE_SERVICE_ROLE_KEY PRODUCTION_URL)
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing production value: $name"; exit 1; }
          done
      - name: Load Vercel automation bypass
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          bypass="$(jq --raw-output '.protectionBypass | to_entries[] | select(.value.scope == "automation-bypass") | .key' <<< "$response" | head -n 1)"
          test -n "$bypass" || { echo "Vercel automation bypass is not configured"; exit 1; }
          echo "::add-mask::$bypass"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass" >> "$GITHUB_ENV"
      - name: Apply forward-only database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --no-install supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          npx --no-install supabase db push --linked --dry-run
          npx --no-install supabase db push --linked
      - name: Validate production database and environment
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run env:validate && npm run migrate:validate
      - name: Create staged production deployment
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: echo "url=$(npx --yes vercel@59.23.2 --prod --skip-domain --yes --token '${{ secrets.VERCEL_TOKEN }}')" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Validate staged deployment
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:browser
      - uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        with:
          urls: ${{ steps.deploy.outputs.url }}/login
          configPath: ./lighthouserc.deployment.cjs
          uploadArtifacts: true
      - name: Promote exact staged deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.23.2 promote '${{ steps.deploy.outputs.url }}' --scope "$VERCEL_ORG_ID" --token '${{ secrets.VERCEL_TOKEN }}'
      - name: Verify production or roll back
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if ! npm run test:e2e; then
            npx --yes vercel@59.23.2 rollback --scope "$VERCEL_ORG_ID" --token '${{ secrets.VERCEL_TOKEN }}'
            exit 1
          fi
