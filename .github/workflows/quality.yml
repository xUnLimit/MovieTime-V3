name: quality

# Gates de calidad versionados (auditoria 2026-05-30, Fase 0 #A: CI/CD).
# Antes, lint/test/build/migrate solo corrian a mano en local: nada impedia
# que un PR con tests rotos llegara a main. Este workflow los ejecuta en cada
# PR y push a main.

on:
  pull_request:
  push:
    branches: [main]

# Cancela ejecuciones previas del mismo ref para no malgastar minutos.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necesario para que el secret scan pueda diffear contra la rama base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (archivos cambiados vs base)
        run: |
          # scan-secrets.mjs revisa archivos staged + working-tree. En un checkout
          # limpio de CI no hay nada staged, asi que stageamos el diff contra la
          # base del PR (o el commit anterior en push) para que tenga algo que revisar.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -z | xargs -0 -r git add -N
          fi
          npm run secrets:scan

      - name: Lint
        run: npm run lint

      - name: Typecheck application + tests
        run: npm run typecheck

      - name: Tests + coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # src/config/env.ts NO valida estricto durante `next build` (detecta la fase de
          # build via NEXT_PHASE): el build no necesita credenciales de runtime, asi que
          # NO hacen falta placeholders. Si los secrets reales estan configurados se usan;
          # si no, el build compila igual y la validacion estricta corre en runtime real.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  supabase-validation:
    name: supabase migrate:validate
    runs-on: ubuntu-latest
    # Solo corre cuando los secrets de Supabase estan configurados en el repo.
    # Si no lo estan (forks, contribuidores externos), se omite en vez de fallar.
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase secrets
        id: check
        run: |
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets no configurados; se omite migrate:validate."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Validate Supabase migrations + data + security
        if: steps.check.outputs.configured == 'true'
        run: npm run migrate:validate
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
