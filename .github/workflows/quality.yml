name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  quality:
    name: security + types + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secret scan (complete repository)
        run: npm run secrets:scan:all
      - name: Dependency policy
        run: npm run security:audit:prod && npm run security:audit:all
      - name: Static analysis and lint
        run: npm run security:static
      - name: Typecheck application and tests
        run: npm run typecheck
      - name: Migration safety
        run: npm run migrate:lint
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Changed-code coverage
        run: npm run coverage:diff
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Production build
        run: npm run build:verify
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser smoke, accessibility and performance budgets
        run: npm run test:browser
      - name: Generate CycloneDX SBOM
        run: npm run sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            sbom.cdx.json
            coverage/
            playwright-report/
          retention-days: 30

  lighthouse:
    name: lighthouse budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:verify
      - uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder-000000000
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-vapid-public-placeholder-00000
          VAPID_PRIVATE_KEY: ci-vapid-private-placeholder-0000
          PUSH_CRON_SECRET: ci-cron-secret-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder-0000
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  database:
    name: migrations from zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start clean local Supabase and apply every migration
        run: npx --no-install supabase start
      - name: Validate local database invariants
        shell: bash
        run: |
          npx --no-install supabase status -o env > supabase-status.env
          set -a
          source supabase-status.env
          set +a
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run migrate:validate

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          output: codeql-results
          upload: never
      - name: Block every CodeQL finding
        shell: bash
        run: |
          count="$(jq -s '[.[].runs[]?.results[]?] | length' codeql-results/*.sarif)"
          test "$count" -eq 0 || { echo "CodeQL findings: $count"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30
