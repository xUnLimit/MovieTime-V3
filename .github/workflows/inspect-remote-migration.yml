name: inspect remote migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read the unmatched production migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          query = (
              "select version, name, statements "
              "from supabase_migrations.schema_migrations "
              "where version = '20260928030740'"
          )
          url = f"https://api.supabase.com/v1/projects/{os.environ['SUPABASE_PROJECT_ID']}/database/query"
          request = Request(
              url,
              data=json.dumps({"query": query, "read_only": True}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
          with open("remote-migration.json", "w", encoding="utf-8") as artifact:
              json.dump(result, artifact, ensure_ascii=False, indent=2)
          print("Remote migration inspection saved as a restricted workflow artifact.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-migration-inspection
          path: remote-migration.json
          retention-days: 1
