name: Executive Push Scheduler

on:
  schedule:
    # Runs every 5 minutes. The endpoint itself guards against duplicate sends
    # using executive_push_last_sent_date; only fires once per day at the configured time.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-executive-push:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger scheduled executive push
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PUSH_DAILY_URL: ${{ vars.PUSH_DAILY_URL || 'https://system.movietimepty.top/api/push/daily' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; push trigger cannot run."
            exit 1
          fi
          echo "Triggering push at $PUSH_DAILY_URL"
          curl_args=(
            --fail-with-body
            --request POST "$PUSH_DAILY_URL"
            --header "Authorization: Bearer $CRON_SECRET"
            --header "Content-Type: application/json"
          )
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            curl_args+=(--header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          curl "${curl_args[@]}"
