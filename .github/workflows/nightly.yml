name: nightly

# Controles lentos o que cambian sin commits (aparecen CVE nuevas, deriva de dependencias, codigo muerto de solo-tests).
# Corren fuera del camino de PR para no frenar los cambios.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  audits:
    name: dependency audits and dead-code report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency policy
        run: npm run security:audit:prod && npm run security:audit:all
      - name: Dead code in production mode (informe, no bloqueante)
        run: |
          set +e
          npx --no-install knip --production --no-progress --reporter compact | tee knip-production.txt
          echo "knip --production termino con codigo $?" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knip-production-report
          path: knip-production.txt
          retention-days: 14

  mutation:
    name: critical mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:mutation

  e2e-authenticated:
    name: authenticated browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install supabase start
      - run: npx --no-install playwright install --with-deps chromium
      - name: Build and test authenticated flows
        shell: bash
        run: |
          set -a
          source <(npx --no-install supabase status -o env)
          set +a
          export E2E_SUPABASE_URL="$API_URL"
          export E2E_SUPABASE_ANON_KEY="$ANON_KEY"
          export E2E_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export E2E_ADMIN_EMAIL='e2e-admin@example.com'
          export E2E_ADMIN_PASSWORD='E2e-Admin-Local-Password1!'
          export E2E_OPERATOR_EMAIL='e2e-operator@example.com'
          export E2E_OPERATOR_PASSWORD='E2e-Operator-Local-Password1!'
          export E2E_WHATSAPP_APP_SECRET='e2e-local-whatsapp-app-secret'
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export AUTH_GATE_PORT=3211
          export NEXT_PUBLIC_APP_URL=http://127.0.0.1:3211
          npm run build:verify
          npm run test:e2e:auth
